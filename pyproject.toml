[project]
name = "inspect-experiments"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Heather Woods", email = "heather.fuzzylogic@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "google-genai>=3.0.0",
    "inspect-ai>=0.3.286",
    "inspect-evals>=0.26.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
inspect-experiments = "inspect_experiments:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
]
